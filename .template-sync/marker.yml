# Template-sync adoption marker for EFingPlanner.
#
# Records which upstream modules were retained at first adoption, the authorized
# protected-file decisions, and intentional local deviations, so future template
# syncs stay clean. `last_reviewed_template_commit` is intentionally unset until
# an upstream commit is actually reviewed during a sync.
#
# Range base for the first sync. When Step 13 of TEMPLATE_UPDATE_PROCEDURE.md
# sets `last_reviewed_template_commit`, it replaces the lines from here to the
# end of this comment.
#
# - Base: the upstream template commit
#   https://github.com/franklesniak/copilot-repo-template/commit/92528d38da4ec9205f92ceb26addeca94692c39e
#   which merged the template pull request
#   https://github.com/franklesniak/copilot-repo-template/pull/824
# - Evidence: that commit's tree is identical to the tree of this repository's
#   first commit, the one `git rev-list --max-parents=0 HEAD` prints. Compare
#   `git rev-parse <commit>^{tree}` for the two commits.
# - Effect: the next sync may run as a "first sync from known lineage" from
#   this base instead of a full reconciliation, once the owner confirms the
#   base, as Step 4 of the procedure requires.
#
# New upstream modules. The upstream manifest now defines seven modules that
# this repository's manifest does not have, and the owner must choose each
# one at that sync. The agent files this repository keeps for them:
#
# - agent-copilot: none. Upstream maps .github/copilot-instructions.md to
#   agent-instructions alone, and this module to
#   .github/workflows/copilot-setup-steps.yml and docs/copilot-setup.md,
#   which this repository does not have.
# - agent-claude: CLAUDE.md and .claude/
# - agent-codex: AGENTS.md and .codex/
# - agent-gemini: GEMINI.md
# - agent-hermes: .hermes.md
# - agent-cursor: .cursor/rules/
# - instruction-enforcement: none; the owner decides whether to adopt it.
template_sync:
  source_repo: https://github.com/franklesniak/copilot-repo-template.git
  included_modules:
    - baseline
    - agent-instructions
    - github-platform
    - github-actions
    - github-templates
    - markdown
    - template-sync-support
    - json
    - yaml
    - schema
  protected_file_decisions:
    - path: .github/copilot-instructions.md
      adoption_mode: minimal-preservation
      decision: MERGE
      authorization_basis: >-
        Owner authorized trimming excluded-module reference-only blocks at
        first-init (question Q-A); the empty Python/Terraform Running-Linters
        and Running-Tests subheader removal and the template-onboarding
        OPTIONAL_CONFIGURATIONS.md reference removal, and the
        schema-reference-only editable-install and README-pointer cleanup, were
        owner-authorized during the PR #5 review (https://github.com/franklesniak/EFingPlanner/pull/5).
        In the same review, the owner authorized removing six PowerShell
        references that upstream leaves outside any template-sync block:
        https://github.com/franklesniak/EFingPlanner/pull/5
        The owner authorized taking this file from the template with the
        SHA-form `uses:` examples, without the workflow security contract
        entry, and with step 9's path for a finding that warrants no guide
        change:
        https://github.com/franklesniak/EFingPlanner/pull/41
        The owner authorized raising the review loop's limits to eighty
        review rounds and eight days per loop invocation:
        https://github.com/franklesniak/EFingPlanner/pull/48
        On 2026-09-30 the owner authorized the local changes that the decision
        process selected for the pending protected-file prompts: the
        Template-Derived Files subsection, the docs/writing_checkers.md bullet,
        and upstream's plain `uses:` examples in place of the SHA-form ones:
        https://github.com/franklesniak/EFingPlanner/issues/72#issuecomment-5912916273
        https://github.com/franklesniak/EFingPlanner/issues/30#issuecomment-5912916873
        https://github.com/franklesniak/EFingPlanner/issues/72#issuecomment-5912918383
      authorized_scope: >-
        Remove excluded-module reference-only blocks
        (powershell/python/terraform/git-lfs/azure); remove the emptied
        Python/Terraform Running-Linters and Running-Tests subheaders left
        after content-stripping; and remove, from the retained
        schema-reference-only block, the excluded template-onboarding
        OPTIONAL_CONFIGURATIONS.md reference, the broken editable-install
        command (no downstream Python package metadata), and the dangling
        README prerequisite pointer. Retained content and instruction-contract
        anchors preserved. Remove the six PowerShell references that upstream
        leaves outside any block: the Pester tests line for
        `tests/PowerShell/`, the PowerShell row of the instruction-file list,
        the Pester note, the PSScriptAnalyzer bullet, and the two
        `**PowerShell:**` subheaders under Running Linters and Running Tests.
        Keep five local passages. First, a maximum of eighty review rounds and
        eight days per loop invocation, where upstream has eight rounds and six
        hours. Second, no protected-file entry for
        `.github/workflow-security-contract.yml`, which this repository does not
        have. Third, step 9's path for an evaluation that finds no guide change
        is warranted: "record that determination and its reason; no prompt is
        required". Fourth, the "Template-Derived Files" subsection after
        "Template Adoption and Stack Selection", until the template carries an
        equivalent rule; then take the template's text. Fifth, the "Modular
        Instructions" bullet for `docs/writing_checkers.md`, a page only this
        repository has. Merge every other upstream change to this file.
    - path: CLAUDE.md
      adoption_mode: minimal-preservation
      decision: MERGE
      authorization_basis: >-
        Owner explicitly authorized trimming excluded-module reference-only
        blocks during first-init (question Q-A).
        The owner authorized taking this file from the template without the
        `CLAUDE.local.md` tracked-file check claim and the Copilot-recipe link,
        and with step 8's path for a finding that warrants no guide change:
        https://github.com/franklesniak/EFingPlanner/pull/41
        The owner authorized raising the review loop's limits to 80 review
        rounds and 8 days per loop invocation:
        https://github.com/franklesniak/EFingPlanner/pull/48
      authorized_scope: >-
        Remove powershell/python/terraform/git-lfs/azure reference-only blocks;
        retained Claude platform protocol preserved. Keep three local
        passages. First, 80 review rounds and an 8-day wall-clock timeout per
        loop invocation, with both pause messages, where upstream has 8 rounds
        and 6 hours. Second, no sentences claiming a tracked-file check for
        `CLAUDE.local.md`, which this repository does not have (the rule
        itself stays), and no link to the Copilot review recipe in
        `docs/PR_REVIEW_PROMPTS.md`, whose heading this repository does not
        have. Third, step 8's path for an evaluation that finds no guide change
        is warranted: "record that determination and its reason; no prompt is
        required". Merge every other upstream change to this file.
    - path: AGENTS.md
      adoption_mode: minimal-preservation
      decision: MERGE
      authorization_basis: >-
        Owner explicitly authorized trimming excluded-module reference-only
        blocks during first-init (question Q-A).
        The owner authorized taking this file from the template without the
        Copilot-recipe link, and with step 8's path for a finding that warrants
        no guide change:
        https://github.com/franklesniak/EFingPlanner/pull/41
        The owner authorized raising the review loop's limits to 80 review
        rounds and 8 days per cycle invocation:
        https://github.com/franklesniak/EFingPlanner/pull/48
      authorized_scope: >-
        Remove excluded-module reference-only blocks; retained Codex platform
        protocol preserved. Keep two local passages. First, 80 review rounds
        and an 8-day wall-clock timeout per cycle invocation, where upstream
        has 8 rounds and 6 hours. Second, no link to the Copilot review recipe
        in `docs/PR_REVIEW_PROMPTS.md`, whose heading this repository does not
        have, and step 8's path for an evaluation that finds no guide change
        is warranted: "record that determination and its reason; no prompt is
        required". Merge every other upstream change to this file.
    - path: GEMINI.md
      adoption_mode: minimal-preservation
      decision: MERGE
      authorization_basis: Owner explicitly authorized trimming excluded-module reference-only blocks during first-init (question Q-A).
      authorized_scope: Remove excluded-module reference-only blocks only.
    - path: .hermes.md
      adoption_mode: minimal-preservation
      decision: MERGE
      authorization_basis: Owner explicitly authorized trimming excluded-module reference-only blocks during first-init (question Q-A).
      authorized_scope: Remove excluded-module reference-only blocks only.
    - path: .cursor/rules/repository-instructions.mdc
      adoption_mode: minimal-preservation
      decision: MERGE
      authorization_basis: >-
        Owner explicitly authorized trimming excluded-module reference-only
        blocks during first-init (question Q-A).
        The owner authorized giving this file the protected-file paragraph
        that names the instruction-contract catalog ("Yes, option D"):
        https://github.com/franklesniak/EFingPlanner/pull/44
      authorized_scope: >-
        Remove excluded-module reference-only blocks. Keep one local passage:
        the protected-file paragraph that names
        `.template-sync/instruction-contracts.yml` among the protected
        governance files, as `GEMINI.md` and `.hermes.md` do; upstream's Cursor
        rule leaves the catalog out. Merge every other upstream change to this
        file.
    - path: .github/instructions/powershell.instructions.md
      decision: REMOVE-LOCAL
      authorization_basis: Owner explicitly authorized deleting the excluded-module instruction files during first-init (question Q-B).
      authorized_scope: Deletion of powershell/python/terraform instruction files only.
      reason: PowerShell module excluded.
    - path: .github/instructions/python.instructions.md
      decision: REMOVE-LOCAL
      authorization_basis: Owner explicitly authorized deleting the excluded-module instruction files during first-init (question Q-B).
      authorized_scope: Deletion of powershell/python/terraform instruction files only.
      reason: Python module excluded.
    - path: .github/instructions/terraform.instructions.md
      decision: REMOVE-LOCAL
      authorization_basis: Owner explicitly authorized deleting the excluded-module instruction files during first-init (question Q-B).
      authorized_scope: Deletion of powershell/python/terraform instruction files only.
      reason: Terraform module excluded.
    - path: .github/instructions/docs.instructions.md
      adoption_mode: minimal-preservation
      decision: MERGE
      authorization_basis: >-
        Owner authorized rewriting the Prohibited Patterns bullet on the repo-local
        check-prohibited-placeholders hook in a review thread:
        https://github.com/franklesniak/EFingPlanner/pull/28#discussion_r4004076363
        On 2026-09-29 the owner authorized one more sentence in that bullet, on
        how GitHub's renderer shows raw-text tags, with local-only placement:
        https://github.com/franklesniak/EFingPlanner/issues/71
        This supersedes the first-initialization SKIP (question Q-C).
      authorized_scope: >-
        Keep the local Prohibited Patterns bullet that describes the repo-local
        check-prohibited-placeholders hook (its scope of docs/, framework/, and
        destinations/, what it allows, and how it reads raw-text elements),
        because that hook is local and upstream's is not the same. Merge every
        other upstream change to this file.
    - path: .github/instructions/yaml.instructions.md
      adoption_mode: minimal-preservation
      decision: MERGE
      authorization_basis: >-
        The owner authorized taking this guide from the template without its
        sentence pair on instruction contracts and focused example tests
        ("Yes, option D"):
        https://github.com/franklesniak/EFingPlanner/pull/44
      authorized_scope: >-
        Keep one local passage: the guide leaves out the sentence pair
        "Instruction contracts and focused example tests protect this guidance.
        They do not validate every downstream workflow or prove agent
        compliance.", because this repository's instruction-contract catalog
        has no contract for this guide and no test checks its examples. Merge
        every other upstream change to this file. Take the sentence pair back
        when this repository adopts a contract and tests for this guide.
  protected_guide_contract_waivers:
    - path: AGENTS.md
      contract_key: agents-azure-devops-pr-review-protocol
      target_module: azure-devops-collaboration
      reason: GitHub-only adoption; the Azure DevOps PR Review Protocol section is retained intact but is not applicable to this repository.
      authorization_basis: Owner explicitly authorized this protected-guide waiver during first-initialization (chose "Waive in the marker").
    - path: CLAUDE.md
      contract_key: claude-azure-devops-pr-review-protocol
      target_module: azure-devops-collaboration
      reason: GitHub-only adoption; the Azure DevOps PR Review Protocol section is retained intact but is not applicable to this repository.
      authorization_basis: Owner explicitly authorized this protected-guide waiver during first-initialization (chose "Waive in the marker").
    - path: GEMINI.md
      contract_key: gemini-azure-devops-pr-review-protocol
      target_module: azure-devops-collaboration
      reason: GitHub-only adoption; the Azure DevOps PR Review Protocol section is retained intact but is not applicable to this repository.
      authorization_basis: Owner explicitly authorized this protected-guide waiver during first-initialization (chose "Waive in the marker").
    - path: .hermes.md
      contract_key: hermes-azure-devops-pr-review-protocol
      target_module: azure-devops-collaboration
      reason: GitHub-only adoption; the Azure DevOps PR Review Protocol section is retained intact but is not applicable to this repository.
      authorization_basis: Owner explicitly authorized this protected-guide waiver during first-initialization (chose "Waive in the marker").
  local_overrides:
    - path: .github/ISSUE_TEMPLATE/bug_report.yml
      reason: Reshaped from the upstream software-bug form into a no-software curriculum problem report; removed OS/architecture/runtime/shell/run-command and version/regression/reproducibility fields that contradict the README's no-software premise, and tailored the areas, format, and severity options to the printable Markdown curriculum.
      default_decision: SKIP
    - path: .github/ISSUE_TEMPLATE/config.yml
      reason: >-
        Keep the local passages. `blank_issues_enabled` is `false`, with a
        comment that says why: a blank issue shows none of a form's markdown,
        so it skips every form's public-issue notice. When upstream adds its
        one-line comment on blank issues, keep the local comment and do not add
        upstream's. The Discussions contact link is enabled, as the owner chose
        at adoption: its heading drops "(OPTIONAL)", and a three-line comment
        saying that the link assumes Discussions is on replaces the
        commented-out how-to lines. Its `about` text says that posts are public
        and never to post a child's filled-in page or trip details. The
        template's CUSTOMIZE notes on replacing the repository name are
        removed, because adoption substituted it. Merge every other upstream
        change.
      default_decision: MERGE
    - path: .github/ISSUE_TEMPLATE/documentation_issue.yml
      reason: >-
        Keep the local passages. The first markdown element carries the
        public-issue notice of bug_report.yml, with "retype your example" for
        "retype the problem", and links the privacy and safety page by absolute
        URL. When upstream adds its generic visibility notice to this form,
        keep the local notice in its place and do not add upstream's. The
        `triage` label is on. The `doc_version` field and the "Code Example
        Issue" option are removed. Merge every other upstream change.
      default_decision: MERGE
    - path: .github/ISSUE_TEMPLATE/feature_request.yml
      reason: >-
        Keep the local passages. The first markdown element carries the
        public-issue notice of bug_report.yml, with "retype your example" for
        "retype the problem", and links the privacy and safety page by absolute
        URL. When upstream adds its generic visibility notice to this form,
        keep the local notice in its place and do not add upstream's. The
        Additional Context field asks for a mockup or a screenshot of a blank
        page, and says never to post a photo or screenshot of a child's
        filled-in page. The `triage` label is on, the user-story roles are
        parent, educator and child, and the Area options name the curriculum's
        parts, with the CUSTOMIZE note above them removed. Merge every other
        upstream change.
      default_decision: MERGE
    - path: README.md
      reason: Fully tailored, project-specific reader-facing README for the EFingPlanner curriculum.
      default_decision: SKIP
    - path: .gitignore
      reason: >-
        Downstream additions only. `!docs/build/` un-ignores the committed build
        briefs, which the upstream `build/` pattern would otherwise hide. The
        local-only agent working paths (`.orchestration/`,
        `ORCHESTRATOR_PROMPT.md`) pair with the Markdown lint exclusions in
        package.json, .remarkignore, and
        .github/scripts/lint-nested-markdown.js.
      default_decision: MERGE
    - path: LICENSE
      reason: Downstream license is CC BY-NC-SA 4.0, not the upstream template's MIT.
      default_decision: SKIP
    - path: pyproject.toml
      reason: Python package module excluded, but trimmed to pytest config as a local override so retained schema/template-sync Python tests keep their markers.
      default_decision: SKIP
    - path: pyrightconfig.json
      reason: Python package module excluded; retained (trimmed) as local type-check config for the retained Python test suite.
      default_decision: SKIP
    - path: tests/__init__.py
      reason: Shared pytest package marker required by retained template-sync/schema tests; falls under the python catch-all mapping but is load-bearing for retained modules.
      default_decision: SKIP
    - path: tests/_pytest_compat.py
      reason: Shared pytest import shim required by retained template-sync/schema tests; falls under the python catch-all mapping but is load-bearing for retained modules.
      default_decision: SKIP
    - path: tests/test_gitattributes.py
      reason: Baseline .gitattributes regression test retained; falls under the python catch-all mapping but validates the retained baseline file.
      default_decision: SKIP
    - path: .github/workflows/data-ci.yml
      reason: >-
        Local override adds a schema-guard pytest step (test_schema_examples +
        test_dependabot_schema) because the python CI workflow was excluded;
        the full template-sync QA suite is not wired to CI as it assumes the
        pristine upstream template. It also runs the downstream-only `X, not Y`
        recount data-file schema hooks (validate-x-not-y-*). A local step after
        the Python dependency install, "Validate the template-sync adoption",
        runs `python .template-sync/scripts/validate_downstream_adoption.py
        --require-marker`, so a file that maps to an excluded module fails its
        pull request until this marker records it. The header comments name
        only the retained workflows (no python-ci, powershell-ci or
        terraform-ci), drop the template-repository wording of the trigger
        policy, list the `X, not Y` hooks, and link the upstream
        design-decisions page by URL.
      default_decision: MERGE
    - path: .pre-commit-config.yaml
      reason: >-
        Local override excludes docs/spec/ from the
        check-prohibited-placeholders hook because the archived design record
        intentionally uses "TBD" for open trip parameters. It also adds a
        downstream-only check-jsonschema block at the end of the file for the
        `X, not Y` recount's data files and their schemas (validate-x-not-y-*).
        A second downstream-only block after it, a `repo: local` block, runs
        the readability and session-structure gates (check-readability and
        check-session-structure) when a commit changes a file or a link in a
        tree that either gate reads, that tree or a folder above it, or the gate
        itself.
        The Markdown-only block also holds three local leak-check hooks,
        check-family-leaks, check-destination-leaks and check-leaks-tests,
        which run .github/scripts/check-leaks.py and its suite. The
        `check-added-large-files` hook excludes
        `.github/scripts/x-not-y-judgments.json`, with the comment above it,
        because that reviewed data file is over the hook's size limit. The
        check-prohibited-placeholders hook reads `docs/`, `framework/` and
        `destinations/` (`files: ^(docs|framework|destinations)/.*\.md$`),
        where upstream's reads `docs/` only. Where Dependabot has moved a
        hook's `rev` past upstream's (check-jsonschema is 0.38.2 here), keep
        the newer version.
      default_decision: MERGE
    - path: templates/json/
      reason: The json module stays adopted for its validators (check-json and check-jsonschema) and instruction file, but the sample-authoring subtree templates/json/** was pruned to resolve issue 8 (https://github.com/franklesniak/EFingPlanner/issues/8); this directory-level SKIP override prevents template-sync materialization (reconcile_staged_files) from re-creating the deleted starter files on a future sync against an upstream that still ships them, without dropping the retained json infrastructure.
      default_decision: SKIP
    - path: templates/yaml/
      reason: The yaml module stays adopted for its validators (check-yaml and yamllint), .yamllint.yml, and instruction file, but the sample-authoring subtree templates/yaml/** was pruned to resolve issue 8 (https://github.com/franklesniak/EFingPlanner/issues/8); this directory-level SKIP override prevents template-sync materialization (reconcile_staged_files) from re-creating the deleted starter files on a future sync against an upstream that still ships them, without dropping the retained yaml infrastructure.
      default_decision: SKIP
    - path: tests/test_materialize_downstream_adoption.py
      reason: >-
        Five module-level constants were renamed from upstream-tracker issue
        numbers to repository-observable behavior names, because the
        Repository Self-Containment rule in .github/copilot-instructions.md
        forbids an identifier that resolves only inside an external tracker.
        The numbers reached no assertion and no fixture input, so the rename
        is behavior-neutral; MERGE keeps upstream activity visible while the
        local names stand.
      default_decision: MERGE
    - path: tests/test_template_manifest.py
      reason: >-
        Two module-level constants were renamed from upstream-tracker issue
        numbers to repository-observable behavior names, for the same reason
        and with the same measurement as the entry above. The file also adds a
        local test,
        test_procedure_inline_block_inventory_names_every_file_that_holds_a_block,
        with its helper _procedure_inventory, its PROCEDURE_INVENTORY_HEADING
        pattern and the collect_live_inline_block_spans import; the test checks
        that the procedure's inline-block inventory names every file that holds
        a block.
      default_decision: MERGE
    - path: .gitattributes
      reason: >-
        Keep the local `requirements-dev.txt text eol=lf` line and the "Local
        addition" comment above it, which pin the line endings of the
        dependency list the repository's own checks install from. Merge every
        other upstream change.
      default_decision: MERGE
    - path: .github/scripts/check-prohibited-placeholders.py
      reason: >-
        Keep the whole local hook. It is a local rewrite, several times the
        size of upstream's, with CommonMark and raw-text parsing, the
        docs/spec/ default exclusion, a default walk and file counts, and
        tests/test_check_prohibited_placeholders.py tests it. A TAKE would
        replace it with upstream's hook. Port each upstream fix into the local
        hook by hand. The local hook ports upstream's missing-path refusal in
        its own code: a named path with nothing at it, the empty argument
        included, fails the run by name on standard error, the run still
        checks every other path, and a path that is there but is not a scan
        target is still skipped.
      default_decision: MERGE
    - path: .github/scripts/lint-nested-markdown.js
      reason: >-
        Keep the two local glob exclusions, `.orchestration/**` and
        `ORCHESTRATOR_PROMPT.md`, with the comment above them and the header
        line on local-only working paths. They pair with the .gitignore record
        above, and tests/test_lint_exclusions.py asserts them. Merge every
        other upstream change.
      default_decision: MERGE
    - path: .github/workflows/markdownlint.yml
      reason: >-
        Keep the local curriculum gates: the header comment that lists them;
        the comment above Setup Python, which names no Python CI workflow; the
        Install Python dependencies step, which installs pytest, jsonschema and
        PyYAML directly, with its comment, because this repository ships no
        Python package metadata; the steps for the readability,
        session-structure, placeholder-hook, `X, not Y`, required-wording,
        local-only-exclusion, trope-density and self-containment checks and
        their suites; the checkout's full-history fetch that the
        self-containment scan needs; the result step's list of those steps; and
        the `last-updated` and `reading-grade-change` jobs, with their SHA
        pins. No template-sync block wraps the self-containment step or the
        fetch, because both are local and a `python-only` block would name a
        module this repository does not adopt. Merge every other upstream
        change.
      default_decision: MERGE
    - path: .markdownlint.jsonc
      reason: >-
        Keep the local "Fix with" comment line, which also names
        `#.orchestration` and `#ORCHESTRATOR_PROMPT.md`, the two local-only
        working paths. Keep MD041 on, as `"MD041": { "allow_preamble": true }`
        among the configured rules, with the comment above it; upstream turns
        MD041 off because it is not auto-fixable. It is on here because every
        curriculum page needs a title, and `allow_preamble` lets the worked
        examples keep their banner above the title. Keep the two comment lines
        that name `.github/.markdownlint.jsonc`, which turns MD041 off for the
        files under `.github/` (see that record). Merge every other upstream
        change.
      default_decision: MERGE
    - path: .remarkignore
      reason: >-
        Keep the local entries `.orchestration/`, `ORCHESTRATOR_PROMPT.md`,
        `docs/spec/` and `!docs/build/`, so the link check skips the local-only
        working paths and the archived specification and still reads the
        committed build briefs. Merge every other upstream change.
      default_decision: MERGE
    - path: CONTRIBUTING.md
      reason: >-
        Keep the local passages: the "3. Install Python" section, which
        installs the repository's own check dependencies from
        requirements-dev.txt and the pinned check-jsonschema, and the
        renumbered steps after it; the Test Requirements bullet that names the
        checks CI runs (the Data CI schema-guard checks and the Markdown
        checks), in place of upstream's line on the applicable CI matrix; the
        CC BY-NC-SA 4.0 contribution terms that link LICENSE and LICENSING.md,
        in place of upstream's MIT License; the removal of the PowerShell
        passages that upstream keeps outside any block (the two PowerShell
        linting bullets, the PowerShell Validation and PowerShell Tests
        sections, the PowerShell instruction-file row, the PowerShell CI bullet
        and the Pester test-requirement bullet); and the removal of the
        template's notes for adopters (the placeholder-strategy comment at the
        top, the CUSTOMIZE notes and the license comment). Merge every other
        upstream change.
      default_decision: MERGE
    - path: SECURITY.md
      reason: >-
        Keep the local security policy: the Reporting a Vulnerability section,
        which offers only GitHub private vulnerability reporting, publishes no
        security email address and calls a report a "concern"; the best-effort
        Response Timeline with no guaranteed response time for a repository
        that is not actively monitored; and the rewritten Disclosure Policy and
        Supported Versions sections. Merge every other upstream change.
      default_decision: MERGE
    - path: package.json
      reason: >-
        Keep the local identity fields (name, description and keywords), the
        `CC-BY-NC-SA-4.0` license, and the `lint:md` exclusions of
        `#.orchestration` and `#ORCHESTRATOR_PROMPT.md`. Merge every other
        upstream change, then regenerate package-lock.json from the merged
        package.json; never take upstream's lock file.
      default_decision: MERGE
    - path: schemas/README.md
