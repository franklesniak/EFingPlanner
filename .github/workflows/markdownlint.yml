# Markdown and toolchain validation workflow.
#
# This workflow uses markdownlint by David Anson (@DavidAnson)
# Licensed under MIT License
# Source: https://github.com/DavidAnson/markdownlint
#
# Purpose: Enforce Markdown formatting, nested Markdown linting,
# offline repository-local link validation, and the toolchain-EOL regression
# test across the repository, and, on pull requests, the `Last Updated` bump
# on every changed Markdown file that carries the metadata header block
# Runs on: push and pull_request events (the Last Updated job: pull_request only)

name: Markdown and Toolchain Checks

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  markdownlint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # template-sync: begin python-only
          # The self-containment suite asks Git whether a short hash written in
          # a Markdown file names a commit here, because that is the question
          # GitHub answers when it decides whether to render it as a link. The
          # action fetches only the triggering commit by default, so in CI that
          # question came back "no" for every older commit and the step would
          # have reported a reference a reader can click. Only the scan asks,
          # so an adoption without the `python` module drops the fetch with it.
          # https://github.com/actions/checkout#usage
          fetch-depth: 0
          # template-sync: end python-only

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # Python is required so the generated-output nested-Markdown regression can
      # materialize TEMPLATE_UPDATE_PROCEDURE.md and run the real nested linter.
      # That regression is a pytest test that also needs the Node tooling
      # installed below, and this workflow is the only place it runs, so both
      # runtimes are provisioned here to keep the behavior enforced.
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Python dependencies
        # This repository intentionally ships no Python packaging metadata (see
        # pyproject.toml), so an editable install fails on setuptools flat-layout
        # discovery. Install the packages the nested-Markdown regression test
        # needs directly instead, mirroring data-ci.yml. jsonschema is required
        # because the materialization helper validates against bundled schemas.
        run: |
          python -m pip install --upgrade pip
          pip install pytest "jsonschema>=4.18.0" "PyYAML>=6.0.3"

      - name: Run markdownlint on outer files
        id: lint-outer
        continue-on-error: true
        run: npm run lint:md

      - name: Run markdownlint on nested Markdown code fences
        id: lint-nested
        continue-on-error: true
        run: npm run lint:md:nested

      - name: Validate Markdown links
        id: lint-links
        continue-on-error: true
        run: npm run lint:md:links

      - name: Lint materialized generated output (nested Markdown)
        id: lint-generated
        continue-on-error: true
        run: pytest tests/test_materialize_downstream_adoption.py -k passes_nested_markdown_lint -v

      # The three Markdown scanners above skip a small set of local-only working
      # paths by name, unconditionally. If such a path were ever committed it
      # would silently lose link validation and nested-fence validation. This
      # test asserts the condition that makes those exclusions safe: each path
      # stays gitignored and untracked, and every scanner still lists it.
      - name: Verify local-only lint exclusions stay untracked
        id: lint-exclusions
        continue-on-error: true
        run: pytest tests/test_lint_exclusions.py -v

      # Reading level for child-facing curriculum text. The script is
      # deliberately advisory about *scores*: it fails only on the outer
      # hard-fail thresholds (Flesch-Kincaid grade >= 7.5, or >= 18 words per
      # sentence). Files above target but inside those limits print a warning
      # and do not fail the step, so an author gets the signal without the gate
      # becoming noise. It also exits non-zero when an in-scope file cannot be
      # read at all -- a file that was never parsed has not been judged
      # advisory, it has not been judged. Its own unit tests run alongside it.
      # Two steps, not two commands in one step. GitHub Actions runs `run:`
      # blocks under `bash -e`, so a failing pytest would abort the block and
      # the corpus scan would never execute. The job would still fail, because
      # the step outcome feeds the summary below -- but a maintainer would see
      # only the unit-test error and none of the actual readability numbers,
      # which are the part that says what to fix.
      # **Skipped rather than failed when the test is not there.** A
      # downstream adoption that keeps markdown and the workflows but drops
      # the python module has this workflow and not these tests, and an
      # unguarded step then failed pytest for a file the manifest removed on
      # purpose. The compat module is named as well as the test, because the
      # generic Python mapping takes it even where the test itself is kept.
      - name: Check child-facing reading level unit tests
        id: test-readability
        if: >-
          hashFiles('tests/test_check_readability.py') != '' &&
          hashFiles('tests/_pytest_compat.py') != ''
        continue-on-error: true
        run: pytest tests/test_check_readability.py -v

      - name: Check child-facing reading level
        id: lint-readability
        continue-on-error: true
        run: python .github/scripts/check-readability.py

      - name: Run toolchain EOL regression tests
        id: test-toolchain
        continue-on-error: true
        run: npm run test:toolchain-eol

      # Curriculum sessions carry seven mandatory fields. The order is the
      # scaffold: a child with executive-function difficulty needs to know
      # where to start, what they are making, and when they are allowed to
      # be finished. A session that loses its Stop Point in an edit is a
      # session that never ends, and that is not something a reviewer
      # reliably notices across dozens of files.
      # Two steps, not two commands in one step. GitHub Actions runs `run:`
      # blocks under `bash -e`, so a failing pytest would abort the block and
      # the corpus scan would never execute -- the job would still fail, but a
      # maintainer would see only the unit-test error and none of the actual
      # session violations, which are the part that says what to fix.
      - name: Check session structure unit tests
        id: test-structure
        if: >-
          hashFiles('tests/test_check_session_structure.py') != '' &&
          hashFiles('tests/_pytest_compat.py') != ''
        continue-on-error: true
        run: pytest tests/test_check_session_structure.py -v

      - name: Check session structure
        id: lint-structure
        continue-on-error: true
        run: python .github/scripts/check-session-structure.py

      # The placeholder hook runs on every commit through pre-commit, and
      # until this step its own unit tests ran nowhere: a change to its
      # CommonMark reading could pass every required check while breaking the
      # parsing the hook depends on. Its two sibling suites already run here
      # and this one did not, which is the shape of gap that survives by
      # looking like the others.
      - name: Check placeholder hook unit tests
        id: test-placeholders
        if: >-
          hashFiles('tests/test_check_prohibited_placeholders.py') != '' &&
          hashFiles('tests/_pytest_compat.py') != ''
        continue-on-error: true
        run: pytest tests/test_check_prohibited_placeholders.py -v

      # The `X, not Y` recount (.github/scripts/check-x-not-y.py) is a tool,
      # not a gate: its page scan needs a human judgment for every new
      # candidate sentence, so CI runs only its unit tests. Run the scan by
      # hand before a review; the PR that adds pages judges their candidates.
      - name: Check X, not Y recount unit tests
        id: test-x-not-y
        if: >-
          hashFiles('tests/test_check_x_not_y.py') != '' &&
          hashFiles('tests/_pytest_compat.py') != ''
        continue-on-error: true
        run: pytest tests/test_check_x_not_y.py -v

      # A density rewrite must keep the wording a build brief or the spec
      # requires. This test holds the sentences a recount once dropped.
      - name: Check required wording
        id: test-required-wording
        if: >-
          hashFiles('tests/test_required_wording.py') != '' &&
          hashFiles('tests/_pytest_compat.py') != ''
        continue-on-error: true
        run: pytest tests/test_required_wording.py -v

      # template-sync: begin python-only
      # A repository-wide rule enforced only by a test nothing runs is a rule
      # in name: a later comment could point at a review round, an issue
      # number or a bare commit hash and every required check would stay
      # green. This suite is the only enforcement the self-containment scan
      # has, so it is the one that most needed wiring.
      # **It always runs, and it fails the job itself.** A condition on a
      # file let the step skip, and a skipped step passed the job: keyed on
      # the module, deleting it skipped the gate; keyed on the fixtures,
      # deleting both did. So there is no condition, and deleting or renaming
      # the scan fails the step, because pytest finds no file to run. An
      # adoption without the `python` module prunes the scan, and the
      # template-sync block round this step and this comment removes both
      # with it; a second block removes the checkout's full-history fetch,
      # which only the scan needs. The step is the last check, so it needs no
      # `continue-on-error` for the
      # checks above to run, and its own failure fails the job. The scan
      # asserts that the three hook suites above, the recount's suite and the
      # required-wording suite are present, so their own steps keep their
      # guards: deleting or renaming one fails this step. It reads Markdown through markdown-it, from
      # the packages `npm ci` installs above, and fails if they are missing.
      - name: Check references resolve inside this repository
        id: test-self-contained
        run: pytest tests/test_self_contained_references.py -v
      # template-sync: end python-only

      - name: Check validation results
        if: >-
          steps.lint-outer.outcome == 'failure' ||
          steps.lint-nested.outcome == 'failure' ||
          steps.lint-links.outcome == 'failure' ||
          steps.lint-generated.outcome == 'failure' ||
          steps.lint-exclusions.outcome == 'failure' ||
          steps.test-readability.outcome == 'failure' ||
          steps.lint-readability.outcome == 'failure' ||
          steps.test-toolchain.outcome == 'failure' ||
          steps.test-structure.outcome == 'failure' ||
          steps.lint-structure.outcome == 'failure' ||
          steps.test-placeholders.outcome == 'failure' ||
          steps.test-x-not-y.outcome == 'failure' ||
          steps.test-required-wording.outcome == 'failure'
        run: |
          echo "::error::Markdown and toolchain checks failed. Check the logs above for details."
          exit 1

  # The docs guide ("Synchronizing `Last Updated` and `Version` on Content
  # Changes") asks every Markdown file with the metadata header block to bump
  # its `Last Updated` field when its content changes. Review kept catching
  # misses by hand, sixteen times across seven pull requests, so this job
  # checks the pull request's head: each such file's field must match the
  # newest pull request commit that changed its content (see the script's
  # docstring for the full contract). The check needs the pull request's own commits and their
  # author dates, so this job runs only on pull requests, checks out the head
  # commit rather than the synthetic merge commit, and fetches full history.
  # It runs the branch's own script with a read-only token and no persisted
  # credential, like every other job in this workflow.
  last-updated:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pull request head with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      # The check parses Markdown with markdown-it through
      # .github/scripts/render-markdown.js, so it needs Node and node_modules.
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      # Two steps, not two commands in one step, for the same reason as the
      # session-structure check above: a failing unit test must not hide the
      # list of files that need a bump.
      - name: Check Last Updated unit tests
        id: test-last-updated
        continue-on-error: true
        run: pytest tests/test_check_last_updated.py -v

      - name: Check Last Updated on changed Markdown
        id: check-last-updated
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python .github/scripts/check-last-updated.py --base "$BASE_SHA"

      - name: Check Last Updated results
        if: >-
          steps.test-last-updated.outcome == 'failure' ||
          steps.check-last-updated.outcome == 'failure'
        run: |
          echo "::error::Last Updated check failed. Check the logs above for details."
          exit 1
